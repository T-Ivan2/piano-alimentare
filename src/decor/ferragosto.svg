      <stop offset="0.12" stop-color="#FFFFFF"/>
      <stop offset="0.88" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="fg-mask"><rect width="360" height="120" fill="url(#fg-fade)"/></mask>
    <radialGradient id="fg-sunglow" cx="0.5" cy="0.5" r="0.5">
