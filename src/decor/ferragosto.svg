<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120">
  <defs>
    <linearGradient id="fg-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FA8B0"/>
      <stop offset="1" stop-color="#2A7E8A"/>
