<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120">
  <defs>
    <linearGradient id="an-mt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6A7258"/>
      <stop offset="1" stop-color="#3A4030"/>
    </linearGradient>
    <linearGradient id="an-mtlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A9274"/>
      <stop offset="1" stop-color="#4E5640"/>
    </linearGradient>
    <linearGradient id="an-mtback" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#454B38"/>
      <stop offset="1" stop-color="#2C3024"/>
    </linearGradient>
    <linearGradient id="an-meadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E5C38"/>
      <stop offset="1" stop-color="#36402A"/>
    </linearGradient>
    <linearGradient id="an-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.08" stop-color="#FFFFFF"/>
      <stop offset="0.92" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="an-mask"><rect width="360" height="120" fill="url(#an-fade)"/></mask>
    <linearGradient id="an-medal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE7A8"/>
      <stop offset="1" stop-color="#D9A441"/>
    </linearGradient>
    <radialGradient id="an-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8C17D" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E8C17D" stop-opacity="0"/>
    </radialGradient>
    <path id="an-tw" d="M0 -4 C0.6 -1 1 -0.6 4 0 C1 0.6 0.6 1 0 4 C-0.6 1 -1 0.6 -4 0 C-1 -0.6 -0.6 -1 0 -4 Z"/>
    <path id="an-laurel" d="M0 0 C-3 -3 -3 -8 0 -11 C3 -8 3 -3 0 0 Z"/>
    <g id="an-pine">
      <path d="M0 -14 L6 -3 L3 -3 L8 5 L-8 5 L-3 -3 L-6 -3 Z" fill="#2E4A36"/>
      <rect x="-1" y="5" width="2" height="3" fill="#4A3A2A"/>
    </g>
  </defs>

  <!-- stelle -->
  <use href="#an-tw" transform="translate(34 18)" fill="#F3F0E6" opacity="0.7"/>
  <use href="#an-tw" transform="translate(186 12) scale(0.7)" fill="#F3F0E6" opacity="0.6"/>
  <use href="#an-tw" transform="translate(340 30) scale(0.8)" fill="#F3F0E6" opacity="0.6"/>
  <circle cx="150" cy="24" r="1.1" fill="#F3F0E6" opacity="0.6"/>
  <circle cx="220" cy="40" r="1" fill="#F3F0E6" opacity="0.5"/>
  <circle cx="16" cy="56" r="1" fill="#F3F0E6" opacity="0.5"/>

  <!-- montagne -->
  <g mask="url(#an-mask)">
    <path d="M150 120 L208 52 L240 76 L262 60 L320 120 Z" fill="url(#an-mtback)"/>
    <path d="M196 120 L272 22 L360 120 Z" fill="url(#an-mt)"/>
    <path d="M272 22 L360 120 L300 120 L286 74 Z" fill="url(#an-mtlight)" opacity="0.55"/>
    <path d="M258 40 L272 22 L289 44 L283 47 L277 41 L271 49 L265 43 L262 47 Z" fill="#F3F0E6"/>
    <path d="M200 64 L208 52 L218 60 L214 63 L209 59 L205 64 Z" fill="#E4E0D4" opacity="0.85"/>
    <path d="M0 120 L0 104 Q60 92 130 102 Q190 110 250 104 Q310 98 360 104 L360 120 Z" fill="url(#an-meadow)"/>
  </g>
  <use href="#an-pine" transform="translate(214 100)"/>
  <use href="#an-pine" transform="translate(226 104) scale(0.8)"/>
  <use href="#an-pine" transform="translate(322 104) scale(0.9)"/>
  <use href="#an-pine" transform="translate(336 106) scale(0.7)"/>

  <!-- sentiero a tornanti -->
  <path d="M20 114 C60 106 110 112 160 106 C196 102 222 100 246 94 L292 84 L250 74 L284 62 L260 52 L276 40 L272 28" stroke="#E8D9B0" stroke-width="2.2" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
  <circle cx="60" cy="108" r="3" fill="#E8C17D"/>
  <circle cx="160" cy="106" r="3" fill="#E8C17D"/>
  <circle cx="292" cy="84" r="3" fill="#E8C17D"/>
  <circle cx="250" cy="74" r="3" fill="#E8C17D"/>
  <circle cx="284" cy="62" r="3" fill="#E8C17D"/>

  <!-- bandiera sulla vetta -->
  <path d="M272 23 L272 2" stroke="#E8E0CC" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M273 2 C281 0 286 5 295 2 L295 14 C286 17 281 12 273 14 Z" fill="#B4CB86"/>
  <path d="M284 4.4 L285.4 7.2 L288.4 7.6 L286.2 9.6 L286.8 12.6 L284 11.2 L281.2 12.6 L281.8 9.6 L279.6 7.6 L282.6 7.2 Z" fill="#F3F0E6" transform="translate(0 -0.8)"/>

  <!-- medaglia con alloro -->
  <g transform="translate(-62 2)">
    <circle cx="172" cy="46" r="34" fill="url(#an-glow)"/>
    <path d="M162 12 L156 32 L166 34 L172 22 Z" fill="#B4CB86"/>
    <path d="M182 12 L188 32 L178 34 L172 22 Z" fill="#8FA86A"/>
    <circle cx="172" cy="50" r="17" fill="url(#an-medal)"/>
    <circle cx="172" cy="50" r="12.5" fill="none" stroke="#C99434" stroke-width="1.2" opacity="0.7"/>
    <path d="M172 41 L174.6 46.3 L180.5 47.1 L176.2 51.2 L177.3 57 L172 54.2 L166.7 57 L167.8 51.2 L163.5 47.1 L169.4 46.3 Z" fill="#FFF3D0"/>
    <ellipse cx="165" cy="44" rx="2.4" ry="4" fill="#FFFFFF" opacity="0.35" transform="rotate(30 165 44)"/>
    <g fill="#B4CB86">
      <use href="#an-laurel" transform="translate(152 66) rotate(-70)"/>
      <use href="#an-laurel" transform="translate(148 58) rotate(-40)"/>
      <use href="#an-laurel" transform="translate(148 48) rotate(-15)"/>
      <use href="#an-laurel" transform="translate(150 38) rotate(10)"/>
      <use href="#an-laurel" transform="translate(192 66) rotate(70)"/>
      <use href="#an-laurel" transform="translate(196 58) rotate(40)"/>
      <use href="#an-laurel" transform="translate(196 48) rotate(15)"/>
      <use href="#an-laurel" transform="translate(194 38) rotate(-10)"/>
    </g>
    <path d="M152 66 C146 56 146 44 152 34 M192 66 C198 56 198 44 192 34" stroke="#8FA86A" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- coriandoli dorati -->
  <rect x="58" y="40" width="4" height="2.4" rx="0.6" fill="#E8C17D" transform="rotate(30 60 41)"/>
  <rect x="160" y="36" width="4" height="2.4" rx="0.6" fill="#B4CB86" transform="rotate(-30 162 37)"/>
  <rect x="44" y="74" width="4" height="2.4" rx="0.6" fill="#F3F0E6" transform="rotate(50 46 75)"/>
  <circle cx="166" cy="62" r="1.4" fill="#E8C17D"/>
  <circle cx="62" cy="20" r="1.2" fill="#B4CB86"/>
</svg>
