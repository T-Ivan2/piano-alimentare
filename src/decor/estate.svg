<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120">
  <defs>
    <radialGradient id="es-sunglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD27A" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFD27A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="es-sun" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFE7A0"/>
      <stop offset="1" stop-color="#F5A84C"/>
    </radialGradient>
    <ellipse id="es-pet" rx="3.2" ry="8" cy="-10"/>
    <g id="es-sunflower">
      <g fill="#F5C243">
        <use href="#es-pet"/><use href="#es-pet" transform="rotate(30)"/><use href="#es-pet" transform="rotate(60)"/><use href="#es-pet" transform="rotate(90)"/>
        <use href="#es-pet" transform="rotate(120)"/><use href="#es-pet" transform="rotate(150)"/><use href="#es-pet" transform="rotate(180)"/><use href="#es-pet" transform="rotate(210)"/>
        <use href="#es-pet" transform="rotate(240)"/><use href="#es-pet" transform="rotate(270)"/><use href="#es-pet" transform="rotate(300)"/><use href="#es-pet" transform="rotate(330)"/>
      </g>
      <g fill="#E9A23A" transform="rotate(15)">
        <use href="#es-pet" transform="scale(0.8)"/><use href="#es-pet" transform="rotate(60) scale(0.8)"/><use href="#es-pet" transform="rotate(120) scale(0.8)"/>
        <use href="#es-pet" transform="rotate(180) scale(0.8)"/><use href="#es-pet" transform="rotate(240) scale(0.8)"/><use href="#es-pet" transform="rotate(300) scale(0.8)"/>
      </g>
      <circle r="8" fill="#6B4224"/>
      <circle r="5.5" fill="#83532C"/>
      <g fill="#4A2C16">
        <circle cx="-2" cy="-2" r="0.9"/><circle cx="2" cy="-2.5" r="0.9"/><circle cx="3" cy="1.5" r="0.9"/><circle cx="-1" cy="2.5" r="0.9"/><circle cx="-3.5" cy="1" r="0.9"/><circle cx="0.5" cy="0" r="0.9"/>
      </g>
    </g>
    <linearGradient id="es-ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B2F1A" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#3B2F1A"/>
      <stop offset="0.8" stop-color="#3B2F1A"/>
      <stop offset="1" stop-color="#3B2F1A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="es-cone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8B068"/>
      <stop offset="1" stop-color="#C98A42"/>
    </linearGradient>
    <linearGradient id="es-lens" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F49BAF"/><stop offset="1" stop-color="#7A4A8A"/></linearGradient>
  </defs>

  <!-- sole -->
