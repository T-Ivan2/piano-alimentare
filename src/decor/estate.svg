  <path d="M164 30 Q176 22 186 34" stroke="#F5C243" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="1.5 3" fill="none"/>

  <!-- cappello di paglia e occhiali da sole -->
  <ellipse cx="262" cy="111" rx="44" ry="3.4" fill="#000000" opacity="0.28"/>
  <ellipse cx="262" cy="104" rx="44" ry="9" fill="#E8C27A"/>
  <ellipse cx="262" cy="103" rx="38" ry="6.5" fill="#F0D08E"/>
