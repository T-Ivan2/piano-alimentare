  <path d="M240 98 C250 102 274 102 284 98 L284 102 C274 106 250 106 240 102 Z" fill="#E8504A"/>
  <path d="M278 101 C286 96 292 100 288 104 C286 106 282 104 278 101 Z M278 101 C282 106 284 112 280 112 C277 111 277 106 278 101 Z" fill="#D63F3A"/>
