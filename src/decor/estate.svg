  <path d="M306 36 Q312 41 318 36" stroke="#8A4E1E" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <ellipse cx="302" cy="35" rx="2.4" ry="1.4" fill="#F08E7A" opacity="0.6"/>
  <ellipse cx="322" cy="35" rx="2.4" ry="1.4" fill="#F08E7A" opacity="0.6"/>

