  <use href="#es-sunflower" transform="translate(74 36) rotate(6)"/>
  <use href="#es-sunflower" transform="translate(102 64) rotate(-4) scale(0.7)"/>
  <use href="#es-sunflower" transform="translate(138 46) rotate(14) scale(0.9)"/>
  <use href="#es-sunflower" transform="translate(162 74) rotate(-8) scale(0.6)"/>

  <!-- ape -->
  <g transform="translate(196 40) rotate(-10)">
    <ellipse cx="-2" cy="-6" rx="4.5" ry="3" fill="#FFFFFF" opacity="0.75" transform="rotate(-30 -2 -6)"/>
    <ellipse cx="3" cy="-6" rx="4.5" ry="3" fill="#FFFFFF" opacity="0.75" transform="rotate(30 3 -6)"/>
    <ellipse rx="7" ry="5" fill="#F5C243"/>
    <path d="M-2 -4.6 V4.6 M2 -4.8 V4.8" stroke="#3A2A1A" stroke-width="1.8"/>
