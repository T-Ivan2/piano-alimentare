    <path d="M-15 -4 C-15 -9 -4 -9 -4 -4 C-4 1 -15 1 -15 -4 Z" fill="url(#es-lens)" stroke="#C9864A" stroke-width="1.4"/>
    <path d="M15 -4 C15 -9 4 -9 4 -4 C4 1 15 1 15 -4 Z" fill="url(#es-lens)" stroke="#C9864A" stroke-width="1.4"/>
    <path d="M-4 -5.5 C-2 -7 2 -7 4 -5.5" stroke="#C9864A" stroke-width="1.6" fill="none"/>
    <path d="M-15 -5 L-20 -7 M15 -5 L20 -7" stroke="#C9864A" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M-12 -6 L-9 -3 M7 -6 L10 -3" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7" stroke-linecap="round"/>
