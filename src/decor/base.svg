  <path d="M196 20 C196.5 22.5 197 23 199.5 23.5 C197 24 196.5 24.5 196 27 C195.5 24.5 195 24 192.5 23.5 C195 23 195.5 22.5 196 20 Z" fill="#E9E6CE" opacity="0.6"/>
  <circle cx="300" cy="24" r="1.2" fill="#E9E6CE" opacity="0.5"/>
  <circle cx="150" cy="22" r="1" fill="#E9E6CE" opacity="0.5"/>
