  <ellipse cx="270" cy="110" rx="18" ry="2.4" fill="#000000" opacity="0.28"/>
  <path d="M256 66 L284 66 L281 108 C281 109 280 110 279 110 L261 110 C260 110 259 109 259 108 Z" fill="url(#bs-glass)" stroke="#DCEFF2" stroke-opacity="0.6" stroke-width="1"/>
