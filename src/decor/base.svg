<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120">
  <defs>
    <linearGradient id="bs-pot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D98E62"/>
      <stop offset="1" stop-color="#B56A42"/>
    </linearGradient>
    <linearGradient id="bs-bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4EEDC"/>
      <stop offset="1" stop-color="#D9D0B8"/>
    </linearGradient>
    <linearGradient id="bs-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DCEFF2" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#DCEFF2" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="bs-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9D8E6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7CB8CC" stop-opacity="0.55"/>
    </linearGradient>
    <path id="bs-leaf" d="M0 0 C-6 -6 -6 -18 0 -26 C6 -18 6 -6 0 0 Z"/>
    <linearGradient id="bs-ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2C3528" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#2C3528"/>
      <stop offset="0.8" stop-color="#2C3528"/>
      <stop offset="1" stop-color="#2C3528" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ripiano -->
  <path d="M0 120 L0 108 L360 108 L360 120 Z" fill="url(#bs-ground)"/>

  <!-- pianta in vaso -->
  <ellipse cx="78" cy="110" rx="26" ry="2.8" fill="#000000" opacity="0.3"/>
  <g transform="translate(78 80)">
    <use href="#bs-leaf" transform="rotate(-50) scale(1.15)" fill="#7FA45A"/>
    <use href="#bs-leaf" transform="rotate(48) scale(1.1)" fill="#8FB86A"/>
    <use href="#bs-leaf" transform="rotate(-20) scale(1.35)" fill="#9CC478"/>
    <use href="#bs-leaf" transform="rotate(18) scale(1.3)" fill="#7FA45A"/>
    <use href="#bs-leaf" transform="rotate(-2) scale(1.55)" fill="#B0D488"/>
    <path d="M0 0 L-17 -20 M0 0 L18 -21 M0 0 L-12 -31 M0 0 L10 -31 M0 0 L-1 -39" stroke="#5E8442" stroke-width="1" stroke-opacity="0.6" fill="none"/>
  </g>
  <path d="M60 82 L96 82 L92 108 C92 109 91 110 90 110 L66 110 C65 110 64 109 64 108 Z" fill="url(#bs-pot)"/>
  <rect x="57" y="78" width="42" height="8" rx="2.5" fill="#E29C70"/>
  <path d="M68 92 C72 96 84 96 88 92" stroke="#F2C4A0" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- ciotola insalata -->
  <ellipse cx="180" cy="110" rx="40" ry="3" fill="#000000" opacity="0.3"/>
  <g>
    <path d="M150 82 C146 70 156 62 164 68 C166 58 180 56 184 66 C190 58 204 62 202 72 C212 70 216 82 208 86 L152 86 Z" fill="#8FBF6A"/>
    <path d="M156 84 C154 76 162 72 168 76 C172 70 182 72 182 80 C188 74 198 76 196 84 Z" fill="#B0D488"/>
    <circle cx="170" cy="78" r="6" fill="#E8504A"/>
