  <circle cx="275" cy="100" r="1.2" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="272" cy="86" r="1" fill="#FFFFFF" opacity="0.5"/>
  <g transform="translate(284 68)">
    <circle r="9" fill="#F5D44C"/>
    <circle r="7.4" fill="#FFF0A8"/>
    <path d="M0 -7.4 V7.4 M-7.4 0 H7.4 M-5.2 -5.2 L5.2 5.2 M5.2 -5.2 L-5.2 5.2" stroke="#F5D44C" stroke-width="1.1"/>
  </g>
  <path d="M276 60 L268 104" stroke="#9CC478" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M260 80 L262 106" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.6" stroke-linecap="round"/>

  <!-- foglioline e scintille -->
  <path d="M120 40 C126 34 134 36 136 42 C130 46 124 46 120 40 Z" fill="#9CC478" opacity="0.7" transform="rotate(-25 128 40)"/>
  <path d="M230 30 C234 26 240 27 242 31 C238 34 233 34 230 30 Z" fill="#B0D488" opacity="0.6" transform="rotate(20 236 30)"/>
