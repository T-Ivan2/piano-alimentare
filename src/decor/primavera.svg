      <stop offset="0.25" stop-color="#2E3A26"/>
      <stop offset="0.75" stop-color="#2E3A26"/>
      <stop offset="1" stop-color="#2E3A26" stop-opacity="0"/>
    </linearGradient>
  </defs>

