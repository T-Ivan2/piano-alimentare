    <linearGradient id="nt-tree" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FA772"/>
      <stop offset="0.55" stop-color="#3A8A5C"/>
      <stop offset="1" stop-color="#2A6B45"/>
    </linearGradient>
    <radialGradient id="nt-starglow" cx="0.5" cy="0.5" r="0.5">
